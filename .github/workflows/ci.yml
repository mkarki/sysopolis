name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.1'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build -w @sysopolis/app
      - name: Validate synthetic IR against the contract
        run: npm run gen -- --out /tmp/city.json
